<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>六级背单词</title>
<style>
:root{
  --bg:#0d0f13; --card:#161a22; --card2:#1c2130; --line:#272d3b;
  --text:#eef1f6; --muted:#9aa3b2; --dim:#646d7e;
  --accent:#8b9cff; --good:#3dd68c; --warn:#ffb547; --bad:#ff6070; --xp:#c08bff; --fire:#ff8a3d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px);
  overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body.dim{filter:brightness(.55)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit}

/* 顶部 */
.top{display:flex;align-items:center;gap:8px}
.badge{flex:none;font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px;background:linear-gradient(135deg,#6f7dff,#b07bff);color:#fff}
.rank{flex:none;font-size:13px;color:var(--muted)}
.xpbar{flex:1;min-width:30px;height:8px;border-radius:99px;background:#232836;overflow:hidden;position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7c8cff,#c08bff);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.streak{flex:none;font-size:14px;font-weight:700;color:var(--fire)}
.ib{flex:none;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 2px 11px;font-size:13px;color:var(--muted)}
.ring{display:flex;align-items:center;gap:7px}
.ring svg{width:26px;height:26px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:#232836}
.ring .fgc{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{color:var(--text)}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.bad{color:var(--bad)}
.combo{font-weight:800;color:var(--muted)}
.combo.hot{color:var(--fire)}

/* 卡片 */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 13px;margin-bottom:11px}
.card.enter{animation:enter .3s cubic-bezier(.2,.8,.2,1)}
.card.shake{animation:shake .42s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:9px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(139,156,255,.15);color:var(--accent)}
.tag.review,.tag.quick{background:rgba(61,214,140,.13);color:var(--good)}
.tag.relearn{background:rgba(255,181,71,.14);color:var(--warn)}
.tag.wrong{background:rgba(255,96,112,.14);color:var(--bad)}
.means{font-size:19px;line-height:1.45;font-weight:650}
.mean+.mean{margin-top:4px}
.pos{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);border:1px solid rgba(255,181,71,.35);border-radius:6px;padding:0 5px;margin-right:6px;vertical-align:3px}
.cloze{margin-top:11px;font-size:16px;line-height:2.1;color:#c9d0dc;word-break:break-word}
.cn{font-size:14px;color:var(--muted);margin-top:2px}
.src{font-size:12px;color:var(--dim)}
.slot{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle;margin:0 3px}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:1.05em;height:1.5em;font-style:normal;font-weight:800;font-size:17px;line-height:1;
  border-bottom:2px solid #4a5265;color:var(--text);font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace}
.box.t{border-color:var(--accent)}
.box.cur{border-color:var(--text);animation:blink 1.1s steps(2) infinite}
.box.fx{border-color:transparent;color:var(--muted);min-width:.5em}
.box.hint{color:var(--warn);border-color:var(--warn)}
.box.over{color:var(--bad);border-color:var(--bad)}
.box.rv{color:var(--bad);border-color:var(--bad)}
.status{display:flex;align-items:center;gap:10px;margin-top:9px;min-height:22px;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:#2c3242}
.dots i.x{background:var(--bad)}
.msg.near{color:var(--warn);font-weight:700}
.msg.bad{color:var(--bad)}

/* 系统键盘模式的输入框 */
.ans{display:flex;gap:8px;margin:0 0 10px}
.ans input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:#11141b;color:var(--text);padding:0 14px;font-size:20px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;outline:none;-webkit-user-select:text;user-select:text}
.ans input:focus{border-color:var(--accent)}
.ans button{flex:none;width:72px;border-radius:14px;background:linear-gradient(135deg,#6f7dff,#a77bff);color:#fff;font-weight:800}
.acts6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.acts6 button{height:36px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.acts6 button:active{background:#232836}
.acts6 button:disabled{opacity:.35}
.acts6 button.armed{border-color:var(--bad);color:var(--bad);font-weight:700}
.acts6.inline{margin:0 0 11px}

/* 内置英文键盘 */
.kb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#10131a;border-top:1px solid var(--line);
  padding:7px 4px calc(env(safe-area-inset-bottom) + 7px);-webkit-user-select:none;user-select:none;touch-action:manipulation}
.kb .acts6{margin:0 2px 8px}
.kb-row{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
.kb-row.r2{padding:0 5%}
.k{flex:1 1 0;min-width:0;height:46px;border-radius:8px;background:#2a2f3d;color:var(--text);font-size:20px;font-weight:600}
.k.down{background:#565f78}
.k.wide{flex:1.55 1 0;font-size:15px}
.k.ok{background:linear-gradient(135deg,#6f7dff,#a77bff);color:#fff;font-weight:800}

/* 快刷 */
.qword{font-size:33px;font-weight:800;letter-spacing:.5px;text-align:center;margin:4px 0 0;word-break:break-word}
.qphon{text-align:center;color:var(--muted);font-size:14px;min-height:20px}
.qsay{display:flex;justify-content:center;gap:8px;margin:8px 0 12px}
.qsay button{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.opts{display:grid;gap:8px}
.opts button{text-align:left;background:#121620;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:16px;line-height:1.4}
.opts button.ok{border-color:var(--good);background:rgba(61,214,140,.12)}
.opts button.no{border-color:var(--bad);background:rgba(255,96,112,.12)}
.qrow{display:flex;gap:8px;margin-top:9px}
.qrow button{flex:1;padding:11px 6px;border-radius:14px;border:1px solid var(--line);background:#121620;font-weight:650;font-size:15px}
.qrow .unk{border-color:rgba(255,181,71,.5);color:var(--warn)}
.qrow .qkill{flex:.8;color:var(--muted);font-weight:400;font-size:14px}
.qrow .qkill.armed{border-color:var(--bad);color:var(--bad);font-weight:700}
.qd{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.qd .means{font-size:16px;font-weight:500}

/* 上一题 */
.res{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px 13px;margin-bottom:11px}
.res.flash-good{animation:flashg .8s}
.res.flash-warn{animation:flashw .8s}
.rlabel{font-size:12px;color:var(--dim);margin-bottom:2px}
.rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grade{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(61,214,140,.15);color:var(--good)}
.grade.hard{background:rgba(255,181,71,.15);color:var(--warn)}
.grade.fail{background:rgba(255,96,112,.15);color:var(--bad)}
.grade.kill{background:rgba(192,139,255,.15);color:var(--xp)}
.rword{font-size:23px;font-weight:800}
.rxp{margin-left:auto;font-weight:800;color:var(--xp);font-size:14px}
.rphon{font-size:13px;color:var(--muted)}
.rmean{font-size:13px;color:var(--muted);margin-top:3px}
.rbtns{display:flex;gap:8px;margin:8px 0 2px}
.rbtns button{font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.rsent{margin:8px 0 2px;font-size:15px;line-height:1.55;color:#d6dce6}
.rsent b{color:var(--good)}
.rcn{margin:0;font-size:14px;color:var(--muted)}
.rmem{margin:8px 0 0;font-size:13px;color:#e9c46a}
.rreal{margin:6px 0 0;font-size:13px;color:var(--dim)}
.rreal em{font-style:normal;color:var(--muted)}

/* 首页 */
.bookbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:14px}
.bookbar b{font-weight:700}
.bookbar button{flex:none;font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--accent)}
.home h2{margin:2px 0 9px;font-size:21px}
.home h2 b{color:var(--accent)}
.primary{display:block;width:100%;padding:13px;border-radius:14px;background:linear-gradient(135deg,#6f7dff,#a77bff);color:#fff;font-weight:800;font-size:17px;margin-bottom:9px}
a.primary{text-align:center;text-decoration:none}
.linkcard{border-color:rgba(139,156,255,.55)}
.primary:disabled{opacity:.55}
.ghost2{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:#121620;margin-bottom:9px;font-size:16px;font-weight:650;text-align:left}
.ghost2 span{flex:none}
.ghost2 small{color:var(--muted);font-weight:400;font-size:12.5px;text-align:right}
.ghost{display:block;width:100%;padding:11px;border-radius:14px;border:1px solid var(--line);color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.nums div{background:#121620;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.nums b{display:block;font-size:19px}
.nums span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:2px 0}
.note b{color:var(--text)}
.note a{color:var(--accent)}
.syncrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.syncrow button{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--accent)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#121620;font-weight:650}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:50vh;color:var(--muted);text-align:center}

/* 浮层 */
.ov{position:fixed;inset:0;display:none;z-index:50}
.ov.show{display:flex}
#lvl{background:rgba(8,9,12,.82);align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#lvl .big{font-size:15px;letter-spacing:6px;color:var(--xp);font-weight:800}
#lvl .lv{font-size:54px;font-weight:900;background:linear-gradient(135deg,#8b9cff,#e08bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:zoom .6s cubic-bezier(.2,1.4,.4,1)}
#sheet{background:rgba(0,0,0,.55);align-items:flex-end}
#sheet .panel{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--line)}
#sheet h3{display:flex;justify-content:space-between;margin:0 0 4px;font-size:16px}
#sheet h3 button{color:var(--muted);font-size:14px}
#sheet h4{margin:16px 0 2px;font-size:13px;color:var(--dim);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--dim);font-size:12px}
.row>button{flex:none;white-space:nowrap}
details.paste{margin-top:14px;font-size:13px;color:var(--muted)}
details.paste summary{cursor:pointer;padding:6px 0}
details.paste textarea{display:block;width:100%;margin:6px 0 8px;border-radius:10px;border:1px solid var(--line);background:#11141b;color:var(--text);padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;-webkit-user-select:text;user-select:text}
.sw{width:46px;height:28px;border-radius:99px;background:#2b3140;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(18px)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:18px}
.step b{min-width:30px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#0d0f13;font-weight:700}
.tok{display:flex;gap:8px;margin:8px 0}
.tok input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:#11141b;color:var(--text);padding:0 10px;font-size:14px;-webkit-user-select:text;user-select:text}
.tok button{flex:none;padding:0 14px;border-radius:10px;background:var(--accent);color:#0d0f13;font-weight:700}
.bookrow{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:#121620;margin:9px 0 0}
.bookrow.on{border-color:var(--accent)}
.bookrow b{display:block;font-size:16px}
.bookrow small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 4px}
.bookrow span{font-size:12.5px;color:var(--dim)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(30,34,46,.97);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:tin .3s cubic-bezier(.2,.8,.2,1)}
.toast.achv{border-color:rgba(192,139,255,.6)}
.toast.goal{border-color:rgba(61,214,140,.6)}
.toast.out{animation:tout .3s forwards}
#updateBar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:65;padding:11px 14px;border-radius:14px;background:#2b3a8f;color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#updateBar[hidden]{display:none}
.float{position:fixed;z-index:55;font-weight:900;color:var(--xp);pointer-events:none;animation:floatup 1.1s forwards}
.cf{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;z-index:70;pointer-events:none;animation:fall linear forwards}

@keyframes enter{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes blink{50%{border-color:#4a5265}}
@keyframes flashg{0%{box-shadow:0 0 0 2px var(--good),0 0 24px rgba(61,214,140,.35)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flashw{0%{box-shadow:0 0 0 2px var(--warn)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-64px)}}
@keyframes zoom{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="badge" id="lv">Lv.1</span><span class="rank" id="rank">青铜</span>
  <div class="xpbar"><i id="xpFill"></i></div>
  <span class="streak">🔥 <b id="streak">0</b></span>
  <button class="ib" id="tHome" aria-label="回首页" style="visibility:hidden">🏠</button>
  <button class="ib" id="tSet" aria-label="设置">⚙️</button>
</header>
<div class="sub">
  <div class="ring"><svg viewBox="0 0 36 36"><circle class="bgc" cx="18" cy="18" r="15"/><circle class="fgc" id="ringFg" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg><span>今日 <b id="today">0/0</b></span></div>
  <div class="chip" id="syncChip">☁️ 未开启同步</div>
  <div class="combo" id="combo">连对 ×0</div>
</div>
<main id="view"><div class="loading"><div style="font-size:34px">📚</div><div>正在加载词库…</div></div></main>
<div id="kbHost"></div>
<div id="toasts"></div>
<button id="updateBar" hidden>🔄 新版本已经下载好，点这里刷新</button>
<div class="ov" id="lvl"><div class="big">LEVEL UP</div><div class="lv" id="lvlText">Lv.2</div></div>
<div class="ov" id="sheet"><div class="panel" id="panel"></div></div>

<script>
(() => {
'use strict';
const APP_VER = '2026.11.11.2';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SEC = String.fromCharCode(167);
const SYNC_FILE = 'cet6-sync.json';
const IV = [0, 1, 2, 4, 7, 15, 30, 60, 120];
const MASTER = 6;
const ACHV = [
  ['first', '第一个词', 10], ['combo10', '十连对', 30], ['combo30', '三十连对', 80], ['combo50', '五十连对', 150],
  ['combo100', '百连斩', 300], ['goal', '完成一次每日任务', 50], ['streak3', '连续打卡 3 天', 30],
  ['streak7', '连续打卡 7 天', 80], ['streak14', '连续打卡 14 天', 150], ['streak30', '连续打卡 30 天', 300],
  ['streak60', '连续打卡 60 天', 500], ['streak100', '连续打卡 100 天', 1000], ['learn100', '学过 100 个词', 50],
  ['learn500', '学过 500 个词', 200], ['learn1000', '学过 1000 个词', 400], ['learnall', '学完一整本词书', 1000],
  ['master100', '掌握 100 个词', 100], ['master500', '掌握 500 个词', 400], ['master1000', '掌握 1000 个词', 800],
  ['kill20', '斩掉 20 个词', 30], ['flash', '闪电手：10 个字母以上的词 3 秒内一次拼对', 50], ['day100', '一天答题 100 个', 100],
];

/* ================= 存储 ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('手机存储空间不足，进度可能没保存'); } },
};
const rawCfg = LS.get('cet6.cfg', {});
const cfg = Object.assign({

      if (await switchBook(S.book[0], true) && !quiet) toast('词书已跟随另一台设备切换为：' + bookInfo().name);

async function adoptToken(tok, how) {

  if (!tok) return false;
  if (tok === cfg.token) return sync(false);
  if (!navigator.onLine) { toast('没网，联网后再开启同步'); return false; }

  catch (e) { Object.assign(cfg, prev); saveCfg(); chipIdle(); toast(e.status === 401 ? 'token 无效或已过期，没有改动' : '连不上 GitHub，稍后再试'); return false; }

    const n = Object.keys(S.words).length;
    const ok = await askSheet('<h3>用这个 GitHub 账号同步？</h3>'
      + '<p style="font-size:17px;margin:10px 0 6px">账号：<b>' + esc(login || '（未知）') + '</b></p>'
      + '<p class="note">' + (how === 'qr' ? '刚才扫的二维码里带着这个账号的同步密钥。' : '')

      + '<p class="note" style="color:var(--warn);margin-top:8px">不是你自己的账号（比如扫了别人电脑上的码）就点“不是我的”，不然你们俩的进度会混在一起。</p>',

  const r = { w, grade, xp, sent: cloze ? cloze.orig : (w.ex[0] ? w.ex[0].en : ''), spans: cloze ? cloze.spans : [], cn: cloze ? cloze.cn : (w.ex[0] ? w.ex[0].cn : ''), real };

/* ================= 快刷：看英文选中文（刷词书 / 快刷已学） ================= */
function startQuick(mode) {
  const queue = buildQueue(mode);
  if (!queue.length) { toast(mode === 'review' ? '还没有学过的词：先去“拼写练习”或“刷词书”' : '这本词书没有可刷的词'); return; }
  sess = { mode, queue, i: 0, n: 0, ok: 0, xp: 0, start: Date.now() };
  quickNext();
}
function firstMean(w) { const [p, t] = splitMean(w.mean[0] || ''); return { p, t: t.length > 30 ? t.slice(0, 30) + '…' : t }; }
let qKillAt = 0;
function quickNext() {
  if (!sess) return;
  if (sess.i >= sess.queue.length) { sessionDone(); return; }
  const it = sess.queue[sess.i], w = it.w, mine = firstMean(w);
  const pool = WORDS.length > 50 ? WORDS : Object.keys(IDX).map(k => IDX[k]);
  const same = pool.filter(x => x.w !== w.w && firstMean(x).p === mine.p);
  const opts = [w], used = new Set([w.w, mine.t]);
  for (let tries = 0; opts.length < 4 && tries < 300; tries++) {
    const src = tries < 150 && same.length > 10 ? same : pool, x = src[Math.floor(Math.random() * src.length)], t = firstMean(x).t;
    if (x.w !== w.w && !used.has(x.w) && !used.has(t)) { opts.push(x); used.add(x.w); used.add(t); }
  }
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  cur = { it, w, t0: Date.now(), done: false, cloze: null };
  qKillAt = 0;
  const where = it.kind === 'browse' ? '第 ' + (it.idx + 1) + ' / ' + bookOrder().length + ' 个' : (sess.i + 1) + ' / ' + sess.queue.length;
  setView('quick', '<section class="card" id="card"><div class="meta"><span class="tag quick">' + (it.kind === 'browse' ? '刷词书' : '快刷已学') + (it.again ? ' · 重刷' : '') + '</span><span>' + where + '</span></div>'
    + '<div class="qword">' + esc(w.w) + '</div><div class="qphon">' + esc(phon(w)) + '</div>'
    + '<div class="qsay"><button data-a="en">🔊 英文</button><button data-a="sent">🔊 例句</button><button data-a="zh" id="qZh" hidden>🔊 中文</button></div>'
    + '<div class="opts">' + opts.map(o => { const m = firstMean(o); return '<button data-w="' + esc(o.w) + '">' + (m.p ? '<span class="pos">' + esc(m.p + '.') + '</span>' : '') + esc(m.t) + '</button>'; }).join('') + '</div>'
    + '<div class="qrow" id="qRow"><button class="unk" id="qUnk">🤔 不认识</button>' + (it.again ? '' : '<button class="qkill" id="qKill">⚔️ 太熟，斩</button>') + '</div>'
    + '<div id="qDetail"></div></section><button class="ghost" id="qQuit">结束这一组</button>');
  $('card').classList.add('enter');
  $('qQuit').onclick = () => sessionDone();
  $('qUnk').onclick = () => quickAnswer(null);
  const qk = $('qKill');
  if (qk) qk.onclick = () => {
    if (Date.now() - qKillAt < 2500) { quickKill(); return; }
    qKillAt = Date.now(); qk.classList.add('armed'); qk.textContent = '再点一次确认';
    setTimeout(() => { if (Date.now() - qKillAt >= 2400 && $('qKill') === qk) { qk.classList.remove('armed'); qk.textContent = '⚔️ 太熟，斩'; } }, 2500);
  };
  document.querySelectorAll('.opts button').forEach(b => b.onclick = () => quickAnswer(b.dataset.w));

}
function quickAnswer(pick) {              // pick：选中的词；null = 点了“不认识”
  if (!cur || cur.done || view !== 'quick') return;
  cur.done = true;
  const it = cur.it, w = cur.w, ok = pick === w.w, secs = (Date.now() - cur.t0) / 1000;
  document.querySelectorAll('.opts button').forEach(x => { if (x.dataset.w === w.w) x.classList.add('ok'); else if (pick && x.dataset.w === pick) x.classList.add('no'); x.disabled = true; });
  let xp = 0, fresh = false;
  if (!it.again) {
    combo = ok ? combo + 1 : 0;
    const had = !!(S.words[w.w] && S.words[w.w][2] > 0);
    if (had) updateState(w, ok ? 'perfect' : 'fail', 'quick', secs);
    else if (!ok) { updateState(w, 'fail', 'quickNew', secs); fresh = true; }       // 没学过又不认识：记成错词，明天开始复习
    else addDay(4, Math.min(secs, 60));                                             // 没学过但认识：只往后翻，不建记录
    xp = ok ? (had ? 4 : 2) : 1;

    checkAchv({ grade: 'quick', secs, len: 0 });
    sess.n++; if (ok) sess.ok++;

  if (!ok) sess.queue.splice(Math.min(sess.i + 4, sess.queue.length), 0, { w, kind: it.kind, idx: it.idx, again: true });      // 这一组里稍后重刷
  saveState(); saveCfg();
  if (ok) { sfx.good(); vib(20); } else { sfx.bad(); vib([50, 40, 50]); }
  if (xp) floatText('+' + xp + ' XP', $('card'));
  sess.i++;

function quickKill() {
  if (!cur || cur.done) return;
  cur.done = true;
  const it = cur.it, w = cur.w;
  updateState(w, 'kill', 'quick', (Date.now() - cur.t0) / 1000);

  try { doc = JSON.parse(String(text || '').trim().replace(/^﻿/, '')); } catch (e) {}
  if (!doc || typeof doc !== 'object' || !doc.words || typeof doc.words !== 'object') { toast('这不是背单词的进度备份'); return false; }
  let learned = 0, last = 0, xp = 0;
  for (const w in doc.words) { const a = doc.words[w]; if (!Array.isArray(a) || a.length < 8) continue; if (+a[2] > 0) learned++; if (+a[7] > last) last = +a[7]; }
  for (const k in (doc.xp || {})) xp += +doc.xp[k] || 0;
  const at = +doc.at || last;
  const ok = await askSheet('<h3>从这个备份恢复？</h3>'
    + '<p style="font-size:16px;margin:10px 0 6px">备份时间：<b>' + esc(at ? new Date(at).toLocaleString() : '未知') + '</b><br>学过 <b>' + learned + '</b> 个词 · 经验 ' + xp + '（Lv.' + level(xp) + '）</p>'
    + '<p class="note">会和这台手机上的进度合并：同一个词以较新的那次为准，不会把新进度改旧。</p>', '恢复', '取消');
  if (!ok) { if (back) back(); return false; }
  const changed = mergeDoc(doc);
  if (S.book && S.book[0] !== bookId && BOOKS.some(b => b.id === S.book[0])) await switchBook(S.book[0], true);
  cfg.dirty = true; saveState(); saveCfg();
  header(); if (view === 'home') renderHome();
  toast(changed ? '已恢复：更新了 ' + changed + ' 个词的进度' : '已恢复：备份里的进度这台手机上都有了');
  if (cfg.token) sync(true);
  return true;
}
// 首页：电脑开着联动（12 小时内开的、还没关）→ 一键跳到电脑的联动页面，不用扫码
function linkCard() {
  if (!cfg.token) return '';
  const now = Date.now();
  const on = Object.keys(S.links).map(d => S.links[d]).filter(l => l.on && l.urls.length && now - l.at < 12 * 3600e3).sort((a, b) => b.at - a.at);
  if (!on.length) return '';
  const l = on[0], t = new Date(l.at), when = (fmtDate(t) === today() ? '' : (t.getMonth() + 1) + '/' + t.getDate() + ' ') + pad(t.getHours()) + ':' + pad(t.getMinutes());
  const alt = l.urls.slice(1).map((u, i) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">地址 ' + (i + 2) + '</a>').join(' · ');
  return '<div class="card linkcard"><div class="meta"><span class="tag">🎧 电脑开着联动</span><span>' + esc(when) + ' 开的</span></div>'
    + '<div class="note">手机读音、显示题目，电脑上打字。手机要和电脑连同一个 Wi-Fi（或连电脑开的热点）。</div>'
    + '<a class="primary" id="goLink" href="' + esc(l.urls[0]) + '" target="_blank" rel="noopener" style="margin:10px 0 0">🔗 连上电脑</a>'
    + '<div class="note" style="margin-top:8px">打不开：看看电脑上的程序还开着没有、是不是同一个 Wi-Fi' + (alt ? '；也可以试试 ' + alt : '') + '。</div></div>';
}
// 首页提醒：没开云同步、学了一些词、一周没备份
function backupCard() {
  if (cfg.token) return '';
  const n = Object.keys(S.words).length, now = Date.now();
  if (n < 30 || now < (cfg.backupSnooze || 0) || (cfg.lastBackup && now - cfg.lastBackup < 7 * 864e5)) return '';
  return '<div class="card"><div class="meta"><span class="tag">💾 备份进度</span></div>'
    + '<div class="note">没开云同步，进度只存在这台手机的浏览器里：换手机、清理浏览器数据就没了。'
    + (cfg.lastBackup ? '上次备份是 ' + Math.floor((now - cfg.lastBackup) / 864e5) + ' 天前。' : '已经学了 ' + n + ' 个词，还没备份过。') + '</div>'
    + '<div class="ask"><button id="bkNow">💾 现在备份</button><button id="bkLater">过几天再说</button></div></div>';
}
$('tSet').onclick = openSheet;
$('tHome').onclick = () => { if (sess && sess.n) sync(true); sayQ = []; stopSay(); renderHome(); };
document.body.classList.toggle('dim', !!cfg.dim);

/* ================= 新版本提示 / 离线缓存 ================= */
$('updateBar').onclick = () => location.reload();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  let hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'update') $('updateBar').hidden = false; });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtl) $('updateBar').hidden = false; hadCtl = true; });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
function cacheBooks() {          // 让离线缓存把已经下载的词书存好
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg => {
    const urls = ['books.json'].concat(BOOKS.filter(b => BOOKW[b.id]).map(bookUrl));
    const target = navigator.serviceWorker.controller || reg.active;
    if (target) target.postMessage({ type: 'cache', urls });
  }).catch(() => {});
}

/* ================= 启动 ================= */
(async () => {
  try {
    try { BOOKS = await (await fetch('books.json')).json(); } catch (e) { BOOKS = []; }
    if (!Array.isArray(BOOKS) || !BOOKS.length) BOOKS = [{ id: 'cet6', name: '六级大纲词汇（★）', file: 'cet6_words.tsv' }];
    let want = S.book && BOOKS.some(b => b.id === S.book[0]) ? S.book[0] : BOOKS[0].id;
    try { await loadBook(bookInfo(want)); }
    catch (e) { if (want === BOOKS[0].id) throw e; want = BOOKS[0].id; await loadBook(BOOKS[0]); }
    useBook(want);
  } catch (e) {
    setView('error', '<div class="loading"><div style="font-size:34px">⚠️</div><div>词库加载失败。第一次打开需要联网，之后就能离线用了。</div></div>');
    return;
  }
  if (sessionStorage.getItem('cet6.debug')) window.__cet6 = { cur: () => cur && cur.w.w, S, cfg, sync, dev: () => dev, view: () => view, submit: v => submit(v), sess: () => sess, typed: () => cur && cur.typed, book: () => bookId, pos: () => getPos(), order: () => bookOrder(), adopt: (t, h) => adoptToken(t, h), link: () => appLink(), backupText: () => backupFile().text() };
  renderHome();
  if (pendingTok) adoptToken(pendingTok, 'qr'); else if (cfg.token) sync(false);
  if (isStandalone()) askPersist();
  for (const b of BOOKS) { if (!BOOKW[b.id]) { try { await loadBook(b); } catch (e) {} } }      // 其余词书在后台下载
  if (S.book && S.book[0] !== bookId && BOOKW[S.book[0]] && !sess) useBook(S.book[0]);
  if (view === 'home') renderHome();
  cacheBooks();
})();
})();
</script>
</body>
