<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>六级背单词</title>
<style>
:root{
  --bg:#0d0f13; --card:#161a22; --card2:#1c2130; --line:#272d3b;
  --text:#eef1f6; --muted:#9aa3b2; --dim:#646d7e;
  --accent:#8b9cff; --good:#3dd68c; --warn:#ffb547; --bad:#ff6070; --xp:#c08bff; --fire:#ff8a3d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 80px);
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body.dim{filter:brightness(.55)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit}

/* 顶部 */
.top{display:flex;align-items:center;gap:9px}
.badge{flex:none;font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px;background:linear-gradient(135deg,#6f7dff,#b07bff);color:#fff}
.rank{flex:none;font-size:13px;color:var(--muted)}
.xpbar{flex:1;height:8px;border-radius:99px;background:#232836;overflow:hidden;position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7c8cff,#c08bff);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.streak{flex:none;font-size:14px;font-weight:700;color:var(--fire)}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 2px 12px;font-size:13px;color:var(--muted)}
.ring{display:flex;align-items:center;gap:7px}
.ring svg{width:28px;height:28px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:#232836}
.ring .fgc{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{color:var(--text)}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.bad{color:var(--bad)}
.combo{font-weight:800;color:var(--muted)}
.combo.hot{color:var(--fire)}
.combo.bump{animation:bump .35s}

/* 卡片 */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:12px}
.card.enter{animation:enter .35s cubic-bezier(.2,.8,.2,1)}
.card.shake{animation:shake .42s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(139,156,255,.15);color:var(--accent)}
.tag.review,.tag.quick{background:rgba(61,214,140,.13);color:var(--good)}
.tag.relearn{background:rgba(255,181,71,.14);color:var(--warn)}
.tag.wrong{background:rgba(255,96,112,.14);color:var(--bad)}
.means{font-size:20px;line-height:1.45;font-weight:650}
.mean+.mean{margin-top:5px}
.pos{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);border:1px solid rgba(255,181,71,.35);border-radius:6px;padding:0 5px;margin-right:6px;vertical-align:3px}
.cloze{margin-top:12px;font-size:16px;line-height:2.15;color:#c9d0dc;word-break:break-word}
.cn{font-size:14px;color:var(--muted);margin-top:2px}
.src{font-size:12px;color:var(--dim)}
.slot{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle;margin:0 3px}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:1.05em;height:1.5em;font-style:normal;font-weight:800;font-size:17px;line-height:1;
  border-bottom:2px solid #4a5265;color:var(--text);font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace}
.box.t{border-color:var(--accent)}
.box.hint{color:var(--warn);border-color:var(--warn)}
.box.over{color:var(--bad);border-color:var(--bad)}
.box.rv{color:var(--bad);border-color:var(--bad)}
.status{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:22px;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:#2c3242}
.dots i.x{background:var(--bad)}
.msg.near{color:var(--warn);font-weight:700}
.msg.bad{color:var(--bad)}

/* 输入 */
.ans{display:flex;gap:8px;margin:0 0 10px}
.ans input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:#11141b;color:var(--text);padding:0 14px;font-size:20px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;outline:none}
.ans input:focus{border-color:var(--accent)}
.ans button{flex:none;width:76px;border-radius:14px;background:linear-gradient(135deg,#6f7dff,#a77bff);color:#fff;font-weight:800}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.acts button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:19px}
.acts button span{font-size:12px;color:var(--muted)}
.acts button:active:not(:disabled){transform:scale(.94)}
.acts button:disabled{opacity:.32}
.acts button.armed{border-color:var(--bad)}
.acts button.armed span{color:var(--bad);font-weight:700}

/* 快刷 */
.qword{font-size:34px;font-weight:800;letter-spacing:.5px;text-align:center;margin:6px 0 0}
.qphon{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}
.qphon button{color:var(--accent);margin-left:6px}
.opts{display:grid;gap:9px}
.opts button{text-align:left;background:#121620;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4}
.opts button.ok{border-color:var(--good);background:rgba(61,214,140,.12)}
.opts button.no{border-color:var(--bad);background:rgba(255,96,112,.12)}

/* 上一题 */
.res{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px 14px;margin-bottom:12px}
.res.flash-good{animation:flashg .8s}
.res.flash-warn{animation:flashw .8s}
.rlabel{font-size:12px;color:var(--dim);margin-bottom:2px}
.rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grade{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(61,214,140,.15);color:var(--good)}
.grade.hard{background:rgba(255,181,71,.15);color:var(--warn)}
.grade.fail{background:rgba(255,96,112,.15);color:var(--bad)}
.grade.kill{background:rgba(192,139,255,.15);color:var(--xp)}
.rword{font-size:24px;font-weight:800}
.rxp{margin-left:auto;font-weight:800;color:var(--xp);font-size:14px}
.rphon{font-size:13px;color:var(--muted)}
.rmean{font-size:13px;color:var(--muted);margin-top:3px}
.rbtns{display:flex;gap:8px;margin:8px 0 2px}
.rbtns button{font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.rsent{margin:8px 0 2px;font-size:15px;line-height:1.55;color:#d6dce6}
.rsent b{color:var(--good)}
.rcn{margin:0;font-size:14px;color:var(--muted)}
.rmem{margin:8px 0 0;font-size:13px;color:#e9c46a}
.rreal{margin:6px 0 0;font-size:13px;color:var(--dim)}
.rreal em{font-style:normal;color:var(--muted)}

/* 首页 */
.home h2{margin:2px 0 10px;font-size:22px}
.home h2 b{color:var(--accent)}
.primary{display:block;width:100%;padding:13px;border-radius:14px;background:linear-gradient(135deg,#6f7dff,#a77bff);color:#fff;font-weight:800;font-size:17px;margin-bottom:9px}
.primary:disabled{opacity:.55}
.ghost2{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#121620;margin-bottom:9px;font-size:16px;font-weight:650}
.ghost2 small{color:var(--muted);font-weight:400;font-size:13px}
.ghost{display:block;width:100%;padding:11px;border-radius:14px;border:1px solid var(--line);color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.nums div{background:#121620;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.nums b{display:block;font-size:20px}
.nums span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:2px 0}
.note b{color:var(--text)}
.syncrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.syncrow button{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--accent)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#121620;font-weight:650}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:50vh;color:var(--muted)}

/* 底部 / 浮层 */
.tools{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);pointer-events:none}
.tools button{pointer-events:auto;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:19px}
.ov{position:fixed;inset:0;display:none;z-index:50}
.ov.show{display:flex}
#lvl{background:rgba(8,9,12,.82);align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#lvl .big{font-size:15px;letter-spacing:6px;color:var(--xp);font-weight:800}
#lvl .lv{font-size:54px;font-weight:900;background:linear-gradient(135deg,#8b9cff,#e08bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:zoom .6s cubic-bezier(.2,1.4,.4,1)}
#sheet{background:rgba(0,0,0,.55);align-items:flex-end}
#sheet .panel{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--line)}
#sheet h3{display:flex;justify-content:space-between;margin:0 0 4px;font-size:16px}
#sheet h3 button{color:var(--muted);font-size:14px}
#sheet h4{margin:16px 0 2px;font-size:13px;color:var(--dim);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--dim);font-size:12px}
.sw{width:46px;height:28px;border-radius:99px;background:#2b3140;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(18px)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:18px}
.step b{min-width:30px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#0d0f13;font-weight:700}
.tok{display:flex;gap:8px;margin:8px 0}
.tok input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:#11141b;color:var(--text);padding:0 10px;font-size:14px}
.tok button{flex:none;padding:0 14px;border-radius:10px;background:var(--accent);color:#0d0f13;font-weight:700}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(30,34,46,.97);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:tin .3s cubic-bezier(.2,.8,.2,1)}
.toast.achv{border-color:rgba(192,139,255,.6)}
.toast.goal{border-color:rgba(61,214,140,.6)}
.toast.out{animation:tout .3s forwards}
.float{position:fixed;z-index:55;font-weight:900;color:var(--xp);pointer-events:none;animation:floatup 1.1s forwards}
.cf{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;z-index:70;pointer-events:none;animation:fall linear forwards}

@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes bump{50%{transform:scale(1.3)}}
@keyframes flashg{0%{box-shadow:0 0 0 2px var(--good),0 0 24px rgba(61,214,140,.35)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flashw{0%{box-shadow:0 0 0 2px var(--warn)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-64px)}}
@keyframes zoom{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="badge" id="lv">Lv.1</span><span class="rank" id="rank">青铜</span>
  <div class="xpbar"><i id="xpFill"></i></div>
  <span class="streak">🔥 <b id="streak">0</b> 天</span>
</header>
<div class="sub">
  <div class="ring"><svg viewBox="0 0 36 36"><circle class="bgc" cx="18" cy="18" r="15"/><circle class="fgc" id="ringFg" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg><span>今日 <b id="today">0/0</b></span></div>
  <div class="chip" id="syncChip">☁️ 未开启同步</div>
  <div class="combo" id="combo">连对 ×0</div>
</div>
<main id="view"><div class="loading"><div style="font-size:34px">📚</div><div>正在加载词库…</div></div></main>
<div class="tools"><button id="tHome" aria-label="回首页" style="visibility:hidden">🏠</button><button id="tSet" aria-label="设置">⚙️</button></div>
<div id="toasts"></div>
<div class="ov" id="lvl"><div class="big">LEVEL UP</div><div class="lv" id="lvlText">Lv.2</div></div>
<div class="ov" id="sheet"><div class="panel" id="panel"></div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SEC = String.fromCharCode(167);
const SYNC_FILE = 'cet6-sync.json';
const IV = [0, 1, 2, 4, 7, 15, 30, 60, 120];
const MASTER = 6;
const ACHV = [
  ['first', '第一个词', 10], ['combo10', '十连对', 30], ['combo30', '三十连对', 80], ['combo50', '五十连对', 150],
  ['combo100', '百连斩', 300], ['goal', '完成一次每日任务', 50], ['streak3', '连续打卡 3 天', 30],
  ['streak7', '连续打卡 7 天', 80], ['streak14', '连续打卡 14 天', 150], ['streak30', '连续打卡 30 天', 300],
  ['streak60', '连续打卡 60 天', 500], ['streak100', '连续打卡 100 天', 1000], ['learn100', '学过 100 个词', 50],
  ['learn500', '学过 500 个词', 200], ['learn1000', '学过 1000 个词', 400], ['learnall', '1718 个词全部学过', 1000],
  ['master100', '掌握 100 个词', 100], ['master500', '掌握 500 个词', 400], ['master1000', '掌握 1000 个词', 800],
  ['kill20', '斩掉 20 个词', 30], ['flash', '闪电手：10 个字母以上的词 3 秒内一次拼对', 50], ['day100', '一天答题 100 个', 100],
];

/* ================= 存储 ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('手机存储空间不足，进度可能没保存'); } },
};
const cfg = Object.assign({
  token: '', gist: '', api: 'https://api.github.com', dailyNew: 20, order: 'freq',
  soundAsked: false, sfx: false, say: false, sent: false, loop: false, vib: true, dim: false,
  lastSync: 0, dirty: false,
}, LS.get('cet6.cfg', {}));
let dev = LS.get('cet6.dev', '');
if (!dev) { dev = 'ph-' + Math.random().toString(36).slice(2, 10); LS.set('cet6.dev', dev); }
// 单词状态与同步文件同一格式：[等级, 下次复习, 次数, 一次答对, 答错, 首次, 最近, 修改时间]
const S = Object.assign({ words: {}, dayLocal: {}, dayRemote: {}, xpLocal: 0, xpRemote: {}, achv: [], best: 0, goal: '' }, LS.get('cet6.state', {}));
const saveCfg = () => LS.set('cet6.cfg', cfg);
// 保存前先和存储里已有的数据合并（同时开着两个页面时，旧页面不会把新进度覆盖掉）
function saveState() {
  const cur = LS.get('cet6.state', null);
  if (cur && cur.words) {
    try {
      const days = {};
      new Set(Object.keys(cur.dayLocal || {}).concat(Object.keys(cur.dayRemote || {}))).forEach(d => {
        days[d] = Object.assign({}, (cur.dayRemote || {})[d] || {});
        if (cur.dayLocal && cur.dayLocal[d]) days[d][dev] = cur.dayLocal[d];
      });
      mergeDoc({ words: cur.words, days, xp: Object.assign({ [dev]: cur.xpLocal || 0 }, cur.xpRemote || {}), achv: cur.achv, best: cur.best, goal: cur.goal });
    } catch (e) {}
  }
  LS.set('cet6.state', S);
}

// 扫电脑上的二维码打开：#t=token（测试时还可以带 api=）
(function readHash() {
  if (!location.hash || location.hash.length < 3) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('t')) { cfg.token = p.get('t').trim(); cfg.gist = ''; cfg.dirty = true; }
  if (p.get('api')) cfg.api = p.get('api');
  if (p.has('debug')) sessionStorage.setItem('cet6.debug', '1');
  saveCfg();
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ================= 日期 ================= */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmtDate(new Date());
function addDays(s, n) { const [y, m, d] = s.split('-').map(Number); return fmtDate(new Date(y, m - 1, d + n)); }

/* ================= 词库 ================= */
let WORDS = [], IDX = {};
function parseWords(text) {
  const pairs = f => f ? f.split('|').filter(Boolean).map(x => x.split(SEC)) : [];
  for (const raw of text.split('\n')) {
    const line = raw.replace(/\r$/, '');
    if (!line || line[0] === '#') continue;
    const c = line.split('\t');
    if (c.length < 12) continue;
    const forms = [c[0].toLowerCase()].concat(c[1] ? c[1].split('|').filter(Boolean).map(s => s.toLowerCase()) : []);
    const w = {
      w: c[0], forms, uk: c[2], us: c[3], mean: c[4].split('|').filter(Boolean),
      ex: pairs(c[5]).map(p => ({ en: p[0], cn: p[1] || '', cloze: p[2] === '1' })),
      real: pairs(c[6]).map(p => ({ en: p[0], src: p[1] || '', cloze: p[2] === '1' })),
      mem: c[7] || '', phr: pairs(c[8]).map(p => ({ en: p[0], cn: p[1] || '' })), rank: +c[11] || 99999,
    };
    WORDS.push(w); IDX[w.w] = w;
  }
}
function phon(w) { if (w.uk && w.us && w.uk !== w.us) return '英/' + w.uk + '/ 美/' + w.us + '/'; const p = w.uk || w.us; return p ? '/' + p + '/' : ''; }
function posLabel(p) {

    + '<h2>🎉 这一轮背完了</h2>' + bonus
    + '<div class="nums"><div><b>' + sess.n + '</b><span>答题</span></div><div><b>' + pct + '%</b><span>一次答对</span></div><div><b>+' + sess.xp + '</b><span>XP</span></div></div>'
    + '<div class="note">用时约 ' + mins + ' 分钟。' + (sess.mode === 'quick' ? '下一轮会接着刷最久没练过的词。' : sess.mode === 'wrong' ? '错题本还剩 ' + wrongList().length + ' 个，下一轮接着刷没练过的。' : '答错的词明天会再考。') + '</div></section>'
    + (more ? '<button class="primary" id="dMore">再来 10 个新词</button>' : '') + '<button class="ghost" id="dHome">回首页</button>'
    + (lastRes ? '<section class="res" id="res"></section>' : ''));
  if (lastRes) { const el = $('res'); el.innerHTML = resultHtml(lastRes); el.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say === 'w' ? lastRes.w.w : lastRes.sent, 0.9)); }
  const m = $('dMore'); if (m) m.onclick = () => startSession('more');
  $('dHome').onclick = renderHome;
  sync(true);
}

/* ================= 快刷：看英文选中文 ================= */
function startQuick() {
  const queue = buildQueue('quick');
  if (!queue.length) { toast('还没有学过的词，先去“拼写练习”学几个新词吧'); return; }
  sess = { mode: 'quick', queue, i: 0, n: 0, ok: 0, xp: 0, start: Date.now() };
  quickNext();
}
function firstMean(w) { const [p, t] = splitMean(w.mean[0] || ''); return { p, t: t.length > 30 ? t.slice(0, 30) + '…' : t }; }
function quickNext() {
  if (sess.i >= sess.queue.length) { sessionDone(); return; }
  const it = sess.queue[sess.i], w = it.w, mine = firstMean(w);
  const pool = WORDS.filter(x => x.w !== w.w);
  const same = pool.filter(x => firstMean(x).p === mine.p);
  const opts = [w], used = new Set([w.w, mine.t]);
  for (let tries = 0; opts.length < 4 && tries < 200; tries++) {
    const src = tries < 120 && same.length > 10 ? same : pool, x = src[Math.floor(Math.random() * src.length)], t = firstMean(x).t;
    if (!used.has(x.w) && !used.has(t)) { opts.push(x); used.add(x.w); used.add(t); }
  }
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  cur = { it, w, t0: Date.now() };
  setView('quick', '<section class="card" id="card"><div class="meta"><span class="tag quick">快刷</span><span>' + (sess.i + 1) + ' / ' + sess.queue.length + '</span></div>'
    + '<div class="qword">' + esc(w.w) + '</div><div class="qphon">' + esc(phon(w)) + '<button id="qSay">🔊</button></div>'
    + '<div class="opts">' + opts.map(o => { const m = firstMean(o); return '<button data-w="' + esc(o.w) + '">' + (m.p ? '<span class="pos">' + esc(m.p + '.') + '</span>' : '') + esc(m.t) + '</button>'; }).join('') + '</div></section>'
    + '<button class="ghost" id="qQuit">结束快刷</button>');
  $('card').classList.add('enter');
  $('qSay').onclick = () => speak(w.w, 0.85);
  $('qQuit').onclick = () => sessionDone();
  if (cfg.say || cfg.loop) speak(w.w, 0.85);
  header();
  document.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    if (cur.done) return; cur.done = true;
    const ok = b.dataset.w === w.w, secs = (Date.now() - cur.t0) / 1000;
    document.querySelectorAll('.opts button').forEach(x => { if (x.dataset.w === w.w) x.classList.add('ok'); });
    if (!ok) b.classList.add('no');
    combo = ok ? combo + 1 : 0;
    const grade = ok ? 'perfect' : 'fail', xp = xpFor(grade, 'quick', combo);
    updateState(w, grade, 'quick', secs); addXp(xp);
    if (combo > S.best) S.best = combo;
    checkAchv({ grade: 'quick', secs, len: 0 });
    sess.n++; if (ok) sess.ok++;
    saveState(); saveCfg();
    if (ok) { sfx.good(); vib(20); } else { sfx.bad(); vib([50, 40, 50]); }
    floatText('+' + xp + ' XP', $('card'));
    sess.i++;
    if (sess.n % 10 === 0) sync(true);
    setTimeout(quickNext, ok ? 650 : 1500);
  });
}

/* ================= 设置 ================= */
const TOGGLES = [
  ['loop', '循环朗读', '新题先读中文意思，再循环读英文，拼对后读例句'],
  ['say', '答对后读单词', '有网用有道真人发音，没网用手机自带语音'],
  ['sent', '答对后读例句', '顺便练听力'],
  ['sfx', '音效', '答对、答错、升级的提示音'],
  ['vib', '震动反馈', '安卓手机支持'],
  ['dim', '调暗屏幕', '地铁上没那么显眼'],
];
function openSheet() { renderSheet(); $('sheet').classList.add('show'); }
function renderSheet() {
  const ord = [['freq', '高频优先'], ['random', '乱序'], ['alpha', '字母序']];
  $('panel').innerHTML = '<h3>设置 <button id="close">完成</button></h3>'
    + '<h4>云同步（和电脑端用同一个 GitHub token）</h4>'
    + '<div class="note">' + (cfg.token ? '已开启 · ' + (cfg.lastSync ? '上次同步 ' + new Date(cfg.lastSync).toLocaleString() : '还没同步过') : '未开启：粘贴只勾选了 gist 权限的 token') + '</div>'
    + '<div class="tok"><input id="tokIn" type="password" placeholder="ghp_…" autocomplete="off"><button id="tokSave">保存</button></div>'
    + (cfg.token ? '<div class="ask"><button id="syncNow">立即同步</button><button id="syncOff">关闭同步</button></div>' : '')
    + '<h4>学习</h4>'
    + '<div class="row"><div>每天新词<small>和电脑端共用当天的数额</small></div><div class="step"><button id="dnMinus">−</button><b>' + cfg.dailyNew + '</b><button id="dnPlus">＋</button></div></div>'
    + '<div class="row"><div>新词顺序</div><div class="seg">' + ord.map(o => '<button data-ord="' + o[0] + '" class="' + (cfg.order === o[0] ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div></div>'
    + '<h4>声音与显示</h4>'
    + TOGGLES.map(t => '<div class="row" data-k="' + t[0] + '"><div>' + t[1] + '<small>' + t[2] + '</small></div><div class="sw' + (cfg[t[0]] ? ' on' : '') + '"></div></div>').join('')
    + '<div class="row" data-test="1"><div>🔊 试听发音<small>没声音先看：手机音量、耳机、静音模式</small></div><button class="ghost" style="width:auto;padding:6px 14px">试听</button></div>'
    + '<h4>关于</h4><div class="note">本机设备号：' + esc(dev) + '<br>词库：六级大纲 ★ 词汇 ' + WORDS.length + ' 个 · 已存在手机里，没网也能背</div>';
  $('close').onclick = () => { $('sheet').classList.remove('show'); if (view === 'home') renderHome(); };
  $('tokSave').onclick = async () => {
    const v = $('tokIn').value.trim(); if (!v) return;
    cfg.token = v; cfg.gist = ''; cfg.dirty = true; saveCfg();
    const ok = await sync(false);
    toast(ok ? '同步已开启' : '同步没成功，看一下顶部的提示');
    renderSheet();
  };
  const sn = $('syncNow'); if (sn) sn.onclick = async () => { await sync(false); renderSheet(); };
  const so = $('syncOff'); if (so) so.onclick = () => { cfg.token = ''; cfg.gist = ''; saveCfg(); chipIdle(); renderSheet(); };
  $('dnMinus').onclick = () => { cfg.dailyNew = Math.max(5, cfg.dailyNew - 5); saveCfg(); renderSheet(); };
  $('dnPlus').onclick = () => { cfg.dailyNew = Math.min(100, cfg.dailyNew + 5); saveCfg(); renderSheet(); };
  $('panel').querySelectorAll('[data-ord]').forEach(b => b.onclick = () => { cfg.order = b.dataset.ord; saveCfg(); renderSheet(); });
  $('panel').querySelectorAll('.row[data-k]').forEach(r => r.onclick = () => {
    const k = r.dataset.k; cfg[k] = !cfg[k]; cfg.soundAsked = true; saveCfg();
    document.body.classList.toggle('dim', !!cfg.dim);
    if (cfg[k] && (k === 'say' || k === 'loop' || k === 'sent')) speak('ready', 0.9);
    if (cfg[k] && k === 'sfx') sfx.good();
    if (k === 'loop' && !cfg.loop) { stopLoop(); stopSay(); }
    renderSheet();
  });
  $('panel').querySelector('[data-test]').onclick = () => speak('pronunciation', 0.9);
}
$('sheet').onclick = e => { if (e.target.id === 'sheet') { $('sheet').classList.remove('show'); if (view === 'home') renderHome(); } };
$('tSet').onclick = openSheet;
$('tHome').onclick = () => { if (sess && sess.n) sync(true); renderHome(); };
document.body.classList.toggle('dim', !!cfg.dim);

/* ================= 启动 ================= */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  try {
    const r = await fetch('cet6_words.tsv');
    parseWords(await r.text());
  } catch (e) {
    setView('error', '<div class="loading"><div style="font-size:34px">⚠️</div><div>词库加载失败。第一次打开需要联网，之后就能离线用了。</div></div>');
    return;
  }
  renderHome();
  if (cfg.token) sync(false);
  if (sessionStorage.getItem('cet6.debug')) window.__cet6 = { cur: () => cur && cur.w.w, S, cfg, sync, dev: () => dev, view: () => view, submit: v => submit(v) };
})();
})();
</script>
